<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Codex Reset Observatory - Tibo Monitor Settings</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #161c2d;
      --border: #232d42;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.3rem;
      margin-top: 0;
      margin-bottom: 8px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p.desc {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #d1d5db;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #0f1422;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    button {
      flex: 1;
      padding: 11px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s, transform 0.1s;
    }
    button.btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    button.btn-primary:hover {
      background: var(--primary-hover);
    }
    button.btn-secondary {
      background: #263147;
      color: #e5e7eb;
      border: 1px solid var(--border);
    }
    button.btn-secondary:hover {
      background: #323f5b;
    }
    #statusMessage {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    #statusMessage.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    #statusMessage.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .checkbox-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
      margin-top: 10px;
    }
    .checkbox-row input {
      margin-top: 3px;
      accent-color: var(--primary);
    }
    .diagnostic-panel {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .notification-test-panel {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .dom-investigation-panel {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .dom-investigation-description {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
      margin: 6px 0 12px;
    }
    .retry-tweet-panel {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .retry-tweet-description {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
      margin: 6px 0 12px;
    }
    .notification-test-description {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
      margin: 6px 0 12px;
    }
    .diagnostic-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .diagnostic-actions button {
      padding: 9px 10px;
      font-size: 0.8rem;
    }
    #diagnosticCount {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡 Tibo Monitor Settings</h1>
    <p class="desc">Vercel Webhook Secretおよび観測所ドメインを設定してください。Webhook secretはブラウザ拡張のローカルストレージに保存され、拡張機能自身のtrusted contextからのみアクセスできます。</p>

    <div class="field">
      <label for="webhookSecret">TIBO_WEBHOOK_SECRET</label>
      <input type="password" id="webhookSecret" placeholder="Vercel環境変数で設定した秘密鍵を入力">
    </div>

    <div class="field">
      <label for="observatoryDomain">Observatory Domain</label>
      <input type="text" id="observatoryDomain" value="https://codex.gussuriworks.com">
    </div>

    <div class="field">
      <label>Local diagnostics</label>
      <label class="checkbox-row">
        <input type="checkbox" id="diagnosticsEnabled" checked>
        <span>Save detailed scan diagnostics in this browser only</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="diagnosticsMaskText" checked>
        <span>Mask post text and display names in DOM snapshots</span>
      </label>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-primary">保存</button>
      <button id="testBtn" class="btn-secondary">接続テスト</button>
    </div>

    <div class="notification-test-panel">
      <label for="notificationTestBtn">通知テスト</label>
      <p class="notification-test-description">本番データを変更せず、Chrome通知だけを確認します。</p>
      <button id="notificationTestBtn" class="btn-secondary">通知をテスト</button>
    </div>

    <div class="dom-investigation-panel">
      <label for="saveRepliesDomBtn">DOM investigation</label>
      <p class="dom-investigation-description">現在開いている Tibo の返信ページの生DOMをローカル保存します。調査用のため、投稿本文など画面内の情報を加工せず保存します。</p>
      <button id="saveRepliesDomBtn" class="btn-secondary">返信ページHTMLを保存</button>
    </div>

    <div class="retry-tweet-panel">
      <label for="retryTweetId">投稿の再送</label>
      <p class="retry-tweet-description">処理済みのTweet IDを1件だけ解除し、現在開いているTibo監視タブへ再スキャンを通知します。</p>
      <input type="text" id="retryTweetId" inputmode="numeric" placeholder="Tweet ID（数字のみ）">
      <button id="retryTweetBtn" class="btn-secondary">この投稿を再送可能にする</button>
    </div>

    <div class="diagnostic-panel">
      <label>Diagnostic log</label>
      <div id="diagnosticCount">読み込み中...</div>
      <div class="diagnostic-actions">
        <button id="refreshDiagnosticsBtn" class="btn-secondary">更新</button>
        <button id="exportDiagnosticsBtn" class="btn-secondary">JSONエクスポート</button>
        <button id="clearDiagnosticsBtn" class="btn-secondary">すべて削除</button>
      </div>
    </div>

    <div id="statusMessage"></div>
  </div>

  <script src="diagnostics.js"></script>
  <script src="scan-utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
