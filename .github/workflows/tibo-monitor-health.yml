name: Tibo monitor health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production monitor health
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          HTTP_STATUS="$(curl --silent --max-time 30 --output "$RESPONSE_FILE" --write-out "%{http_code}" --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://codex-reset-observatory.vercel.app/api/monitor/health")"
          cat "$RESPONSE_FILE"
          if [ "$HTTP_STATUS" != "200" ]; then
            exit 1
          fi
