name: Apply reset scope policy task 1

on:
  push:
    branches:
      - feature/tibo-event-metadata-v1
    paths:
      - .github/workflows/apply-reset-scope-policy-task1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feature/tibo-event-metadata-v1
          fetch-depth: 0
      - name: Apply task 1 patch
        shell: pwsh
        run: |
          $path = "scripts/apply-reset-scope-policy-task1.ps1"
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace(
            '[Parameter(Mandatory = $true)][string]$New',
            '[Parameter(Mandatory = $true)][AllowEmptyString()][string]$New'
          )
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          ./scripts/apply-reset-scope-policy-task1.ps1
      - name: Commit task 1 implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/radar/resetScope.ts lib/radar/types.ts lib/radar/tiboHistory.ts lib/radar.ts components/ResetHistoryDetails.tsx tests/resetScopeNormalizer.test.ts tests/tiboFormalHistory.test.ts
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: normalize reset scope and reason policy"
            git push origin HEAD:feature/tibo-event-metadata-v1
          }
