name: Fix task1 typecheck

on:
  push:
    branches:
      - feature/tibo-event-metadata-v1
    paths:
      - .github/workflows/fix-task1-typecheck.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feature/tibo-event-metadata-v1
          fetch-depth: 0
      - name: Apply minimal view-model fix
        shell: pwsh
        run: |
          $path = "lib/radar.ts"
          $text = [System.IO.File]::ReadAllText($path)
          $old = "        scope: details.scope,"
          $new = '        scope: details.scope ?? "",'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "Expected exactly one public scope mapping, found $count"
          }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git rm .github/workflows/fix-task1-typecheck.yml
      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/radar.ts .github/workflows/fix-task1-typecheck.yml
          git commit -m "fix: keep blank scope compatible with public history type"
          git push origin HEAD:feature/tibo-event-metadata-v1
