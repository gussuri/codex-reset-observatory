name: Verify Supabase Foundation

on:
  push:
    branches:
      - verify/supabase-foundation
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  local-schema:
    name: Fresh local Supabase schema
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0

      - name: Install compatible Corepack
        run: npm install --global corepack@0.35.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify local-only CLI configuration
        run: |
          $version = (& corepack pnpm exec supabase --version).Trim()
          if ($version -ne '2.116.0') {
            throw "Unexpected Supabase CLI version: $version"
          }

          $forbiddenEnvironment = @(
            'SUPABASE_ACCESS_TOKEN',
            'SUPABASE_DB_PASSWORD',
            'SUPABASE_SERVICE_ROLE_KEY',
            'SUPABASE_URL'
          )
          foreach ($name in $forbiddenEnvironment) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrEmpty($value)) {
              throw "Production credential environment variable is present: $name"
            }
          }

      - name: Start local Supabase stack
        run: corepack pnpm exec supabase start

      - name: Fresh migration reset 1
        run: corepack pnpm exec supabase db reset --local --no-seed

      - name: Fresh migration reset 2
        run: corepack pnpm exec supabase db reset --local --no-seed

      - name: Capture local public catalog
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'supabase-catalog'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          $sql = @'
          WITH public_tables AS (
            SELECT c.oid, n.nspname, c.relname, c.relrowsecurity, c.relforcerowsecurity
            FROM pg_class AS c
            JOIN pg_namespace AS n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
          )
          SELECT jsonb_build_object(
            'tables', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', t.nspname,
                'name', t.relname,
                'rlsEnabled', t.relrowsecurity,
                'rlsForced', t.relforcerowsecurity,
                'columns', COALESCE((
                  SELECT jsonb_agg(jsonb_build_object(
                    'ordinalPosition', c.ordinal_position,
                    'name', c.column_name,
                    'dataType', c.data_type,
                    'udtSchema', c.udt_schema,
                    'udtName', c.udt_name,
                    'nullable', c.is_nullable = 'YES',
                    'default', c.column_default
                  ) ORDER BY c.ordinal_position)
                  FROM information_schema.columns AS c
                  WHERE c.table_schema = t.nspname AND c.table_name = t.relname
                ), '[]'::jsonb)
              ) ORDER BY t.relname)
              FROM public_tables AS t
            ), '[]'::jsonb),
            'constraints', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'table', ns.nspname || '.' || rel.relname,
                'name', con.conname,
                'type', con.contype,
                'definition', pg_get_constraintdef(con.oid)
              ) ORDER BY ns.nspname, rel.relname, con.conname)
              FROM pg_constraint AS con
              JOIN pg_class AS rel ON rel.oid = con.conrelid
              JOIN pg_namespace AS ns ON ns.oid = rel.relnamespace
              WHERE ns.nspname = 'public'
            ), '[]'::jsonb),
            'indexes', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', schemaname,
                'table', tablename,
                'name', indexname,
                'definition', indexdef
              ) ORDER BY schemaname, tablename, indexname)
              FROM pg_indexes
              WHERE schemaname = 'public'
            ), '[]'::jsonb),
            'sequences', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', schemaname,
                'name', sequencename,
                'dataType', data_type,
                'startValue', start_value,
                'minValue', min_value,
                'maxValue', max_value,
                'incrementBy', increment_by,
                'cycle', cycle,
                'cacheSize', cache_size,
                'lastValue', last_value
              ) ORDER BY schemaname, sequencename)
              FROM pg_sequences
              WHERE schemaname = 'public'
            ), '[]'::jsonb),
            'policies', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', schemaname,
                'table', tablename,
                'name', policyname,
                'permissive', permissive,
                'roles', roles,
                'command', cmd,
                'using', qual,
                'withCheck', with_check
              ) ORDER BY schemaname, tablename, policyname)
              FROM pg_policies
              WHERE schemaname = 'public'
            ), '[]'::jsonb),
            'tableGrants', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'grantee', grantee,
                'schema', table_schema,
                'table', table_name,
                'privilege', privilege_type,
                'grantable', is_grantable
              ) ORDER BY grantee, table_schema, table_name, privilege_type)
              FROM information_schema.table_privileges
              WHERE table_schema = 'public'
                AND grantee IN ('public', 'anon', 'authenticated', 'service_role', 'postgres')
            ), '[]'::jsonb),
            'sequenceGrants', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', ns.nspname,
                'sequence', seq.relname,
                'role', r.rolname,
                'usage', has_sequence_privilege(r.rolname, seq.oid, 'USAGE'),
                'select', has_sequence_privilege(r.rolname, seq.oid, 'SELECT'),
                'update', has_sequence_privilege(r.rolname, seq.oid, 'UPDATE')
              ) ORDER BY ns.nspname, seq.relname, r.rolname)
              FROM pg_class AS seq
              JOIN pg_namespace AS ns ON ns.oid = seq.relnamespace
              CROSS JOIN pg_roles AS r
              WHERE ns.nspname = 'public'
                AND seq.relkind = 'S'
                AND r.rolname IN ('public', 'anon', 'authenticated', 'service_role', 'postgres')
            ), '[]'::jsonb),
            'views', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', ns.nspname,
                'name', rel.relname,
                'kind', rel.relkind
              ) ORDER BY ns.nspname, rel.relname)
              FROM pg_class AS rel
              JOIN pg_namespace AS ns ON ns.oid = rel.relnamespace
              WHERE ns.nspname = 'public' AND rel.relkind IN ('v', 'm')
            ), '[]'::jsonb),
            'functions', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', ns.nspname,
                'name', p.proname,
                'identityArguments', pg_get_function_identity_arguments(p.oid),
                'kind', p.prokind,
                'result', pg_get_function_result(p.oid),
                'securityDefiner', p.prosecdef
              ) ORDER BY ns.nspname, p.proname, pg_get_function_identity_arguments(p.oid))
              FROM pg_proc AS p
              JOIN pg_namespace AS ns ON ns.oid = p.pronamespace
              WHERE ns.nspname = 'public'
            ), '[]'::jsonb),
            'triggers', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'schema', ns.nspname,
                'table', rel.relname,
                'name', trg.tgname,
                'definition', pg_get_triggerdef(trg.oid)
              ) ORDER BY ns.nspname, rel.relname, trg.tgname)
              FROM pg_trigger AS trg
              JOIN pg_class AS rel ON rel.oid = trg.tgrelid
              JOIN pg_namespace AS ns ON ns.oid = rel.relnamespace
              WHERE ns.nspname = 'public' AND NOT trg.tgisinternal
            ), '[]'::jsonb),
            'extensions', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'name', ext.extname,
                'schema', ns.nspname,
                'version', ext.extversion
              ) ORDER BY ext.extname)
              FROM pg_extension AS ext
              JOIN pg_namespace AS ns ON ns.oid = ext.extnamespace
            ), '[]'::jsonb),
            'migrationHistory', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'version', version,
                'name', name
              ) ORDER BY version)
              FROM supabase_migrations.schema_migrations
            ), '[]'::jsonb)
          ) AS catalog;
          '@

          $sqlPath = Join-Path $artifactDirectory 'catalog.sql'
          $rawPath = Join-Path $artifactDirectory 'catalog-query.json'
          $errorPath = Join-Path $artifactDirectory 'catalog-query.stderr'
          Set-Content -LiteralPath $sqlPath -Value $sql -Encoding utf8NoBOM
          & corepack pnpm exec supabase db query --local --file $sqlPath --output-format json 1> $rawPath 2> $errorPath
          if ($LASTEXITCODE -ne 0) {
            throw (Get-Content -Raw $errorPath)
          }

          $parsed = Get-Content -Raw $rawPath | ConvertFrom-Json
          $row = $parsed
          if ($parsed -is [Array]) {
            $row = $parsed[0]
          } elseif ($null -ne $parsed.rows) {
            $row = @($parsed.rows)[0]
          } elseif ($null -ne $parsed.result) {
            $row = @($parsed.result)[0]
          } elseif ($null -ne $parsed.data) {
            $row = @($parsed.data)[0]
          }
          if ($null -eq $row.catalog) {
            throw 'Supabase db query did not return the catalog column.'
          }

          $catalog = $row.catalog
          $normalizedPath = Join-Path $artifactDirectory 'local-catalog.json'
          $catalog | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $normalizedPath -Encoding utf8NoBOM
          $tableNames = @($catalog.tables | ForEach-Object { $_.name })
          $summary = @(
            '# Local Supabase catalog',
            "- Tables: $($tableNames.Count)",
            "- Table names: $($tableNames -join ', ')",
            "- Constraints: $(@($catalog.constraints).Count)",
            "- Indexes: $(@($catalog.indexes).Count)",
            "- Sequences: $(@($catalog.sequences).Count)",
            "- Policies: $(@($catalog.policies).Count)",
            "- Table grants: $(@($catalog.tableGrants).Count)",
            "- Sequence grant rows: $(@($catalog.sequenceGrants).Count)",
            "- Views: $(@($catalog.views).Count)",
            "- Public functions: $(@($catalog.functions).Count)",
            "- Triggers: $(@($catalog.triggers).Count)",
            "- Applied migrations: $(@($catalog.migrationHistory).Count)"
          )
          $summary | Set-Content -LiteralPath (Join-Path $artifactDirectory 'summary.md') -Encoding utf8NoBOM
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Focused foundation tests
        run: corepack pnpm exec tsx --test tests/supabaseFoundation.test.ts

      - name: Full test suite
        run: corepack pnpm test

      - name: Lint
        run: corepack pnpm run lint

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Production build
        run: corepack pnpm run build

      - name: Check migration verification diff
        run: git diff --check

      - name: Upload local catalog artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-local-catalog
          path: supabase-catalog/
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        continue-on-error: true
        run: corepack pnpm exec supabase stop --no-backup
