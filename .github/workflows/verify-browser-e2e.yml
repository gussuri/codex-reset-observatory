name: Verify Browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
      - name: Install compatible Corepack
        run: npm install --global corepack@0.35.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build production app
        run: corepack pnpm build
      - name: Install Chromium and Linux dependencies
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E
        run: corepack pnpm exec playwright test
