name: Tibo X Full-Auto Monitor & Signal Detector

on:
  schedule:
    # 10分おきに自動チェック
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # GitHub Actions画面からいつでも手動実行可能

jobs:
  monitor-x:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Tibo X Full-Auto Monitor Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/monitor-tibo-x.ts

      - name: Commit and push ONLY when actual site signals or history changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # observationSignals.ts または resetHistory.ts に実際のサイト変化（シグナル追加/履歴追加）があった場合のみコミット＆プッシュ
          git add data/observationSignals.ts data/resetHistory.ts
          git diff --staged --quiet || (git add data/processedTweets.json && git commit -m "feat(auto): auto-apply Tibo X signal/history via Gemini AI" && git push)
