name: Log Reset Probability

on:
  schedule:
    # 毎時0分に実行 (1時間おき)
    - cron: '0 * * * *'
  # GitHubの管理画面から手動で即時実行（テスト）することも可能にします
  workflow_dispatch:

jobs:
  log-probability:
    runs-on: ubuntu-latest
    steps:
      - name: Call Log Probability API
        run: |
          curl -s -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/log-probability"
