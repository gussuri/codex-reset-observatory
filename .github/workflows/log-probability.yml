name: Log Reset Probability

on:
  schedule:
    # 6時間ごとの34分に実行 (0分など混雑する時間帯を避けるための設定)
    # ※GitHub Actionsのcronスケジュールは標準時 (UTC) 基準で設定されます。
    - cron: '34 */6 * * *'
  # GitHubの管理画面から手動で即時実行（テスト）することも可能にします
  workflow_dispatch:

jobs:
  log-probability:
    runs-on: ubuntu-latest
    steps:
      - name: Call Log Probability API and Output Logs
        run: |
          echo "========================================="
          echo "GitHub Actions executed at: $(date -u)"
          # APP_URLはGitHub Secretsに登録されているため、出力時は自動的に *** にマスキングされます
          APP_URL="${{ secrets.APP_URL }}"
          # Keep an old APP_URL secret from routing scheduled logs to the legacy host.
          if [ -z "$APP_URL" ] || [ "$APP_URL" = "https://codex-reset-observatory.vercel.app" ]; then
            APP_URL="https://codex.gussuriworks.com"
          fi
          echo "Calling API Endpoint: $APP_URL/api/log-probability"
          echo "========================================="
          
          # 一時ファイルにレスポンスを保存し、ステータスコードを取得
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$RESPONSE_FILE" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$APP_URL/api/log-probability")
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "-----------------------------------------"
          echo "Response Body:"
          cat "$RESPONSE_FILE"
          echo ""
          echo "========================================="
          
          # 2xx 以外のステータスコードの場合はエラー終了（GitHub Actionsを失敗扱い）にします
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: API call failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
