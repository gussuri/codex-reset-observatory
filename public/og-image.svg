<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="52%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.12" cy="0.06" r="0.44">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.86" cy="0.04" r="0.4">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="radarGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#0f766e" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#ffffff" fill-opacity="0.56" stroke="#0f172a" stroke-opacity="0.14" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="714" y="72" width="414" height="486" rx="28" fill="url(#radarGrid)" opacity="0.62"/>

  <g transform="translate(1008 205)" opacity="0.82">
    <circle r="116" fill="none" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="8"/>
    <circle r="82" fill="none" stroke="#0f766e" stroke-opacity="0.25" stroke-width="3"/>
    <circle r="52" fill="none" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="7"/>
    <path d="M0 0L94 -64" fill="none" stroke="#0f766e" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round"/>
    <circle r="11" fill="#0f172a"/>
  </g>

  <rect x="132" y="174" width="104" height="5" rx="2.5" fill="#14b8a6"/>
  <text x="132" y="294" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700">Codex Reset Observatory</text>
  <text x="132" y="391" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="500">Reset times, updates &amp; history</text>
  <rect x="132" y="430" width="840" height="2" fill="#0f766e" fill-opacity="0.18"/>
